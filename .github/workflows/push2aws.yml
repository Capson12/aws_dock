name: Deploy to AWS

on:
    push:
      branches:
        - "main"

    
jobs:
  build_and_push:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_SECRET_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Build and push Docker image
      run: |
          docker -chdir=web build -t dockerfile/webapp .
          docker -chdir=web tag dockerfile/webapp:latest ${{ secrets.AWS_ECR_URL }}/dockerfile/webapp:latest
          docker -chdir=web push ${{ secrets.AWS_ECR_URL }} /dockerfile/webapp:latest
